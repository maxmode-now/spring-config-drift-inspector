spring.datasource.url=jdbc:postgresql://stage-db:5432/demo
spring.datasource.username=stage

# Expect: SecretExposure. The placeholder default still commits `changeme` to the repo,
# which is the case a naive "has a placeholder, skip it" check misses.
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=validate
server.port=8080
app.feature.timeout=45
app.mail.port=587

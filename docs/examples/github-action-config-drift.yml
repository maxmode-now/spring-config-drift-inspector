# Example: gate PRs on Spring config drift
#
# Copy this file to `.github/workflows/config-drift.yml` in a Spring project.
# It downloads the CLI JAR from a GitHub Release — no need to build this repo in CI.
#
# When upgrading, change both the tag (`v0.2.0`) and the jar filename in the URL below.
#
# Optional: add `.config-drift.yml` at the repo root (fail-on, path, profiles) so the
# check step can omit those flags; explicit CLI flags still win.
#
# Optionally also run with `--format markdown -o drift-report.md` if you want a human
# report artifact in addition to Code Scanning.

name: Config Drift

on:
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  config-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download config-drift CLI
        run: |
          curl -fsSL -o config-drift-cli.jar \
            "https://github.com/maxmode-now/spring-config-drift-inspector/releases/download/v0.2.0/config-drift-cli-0.2.0.jar"

      - name: Check config drift
        run: |
          java -jar config-drift-cli.jar check --path . --fail-on error --format sarif -o drift.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-drift-sarif
          path: drift.sarif
          if-no-files-found: ignore

      - name: Upload to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: drift.sarif

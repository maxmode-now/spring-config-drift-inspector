pluginGroup = io.github.configdrift
pluginVersion = 0.2.1

# Build against the OLDEST supported release, not the newest: compiling against 2025.3 APIs
# guarantees the plugin also runs on 2026.1 and 2026.2, whereas the reverse is not true.
#
# No platformType any more — Community and Ultimate stopped being published as separate artifacts
# at 2025.3, so `intellijIdea(version)` in build.gradle.kts covers both.
platformVersion = 2025.3

# Optional: point at a locally installed IDE instead of downloading the platform.
# Left unset on purpose — the installed IDE here is 2026.2, which would silently let 2026.2-only
# APIs compile while the plugin claims 2025.3 compatibility.
# platformLocalPath = D:/3.Programs/IntelliJ IDEA 2026.2.0.1

# The platform bundles Kotlin stdlib 2.4.0; shipping a second copy risks a runtime
# version clash. Flagged by verifyPluginProjectConfiguration.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache = true
